name: Transcript contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      RESEARCH_FEEDBACK_STATE_ROOT: ${{ runner.temp }}/et-feedback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ET test and check dependencies
        run: python -m pip install pytest requests beautifulsoup4 lxml openai translatepy pyyaml ruff==0.15.18 mypy==1.19.0
      - name: Check source and test lint
        run: ruff check . --extend-exclude docs,.planning
      - name: Compile entry points and test code
        run: python -m compileall -q -l . tools tests
      - name: Check typed retrieval and runtime contracts
        run: >-
          python -m mypy --python-version 3.10 --explicit-package-bases --follow-imports=silent
          retrieval_budget.py retrieval_protocol.py retrieval_process.py
          runtime_scope.py transcript_contracts.py
      - name: Check ET source boundaries
        run: python -m quality.source_checks
      - name: Record offline test inventory
        run: >-
          python -m pytest tests/ -m "not live" --strict-markers --collect-only -q
          -p quality.anti_trick_gate_spec.pytest_probe
          --s6-revision "${{ github.sha }}" --s6-evidence s6-inventory.json
      - name: Exercise all offline tests
        run: >-
          python -m pytest tests/ -m "not live" --strict-markers --capture=sys -q -rfsx --tb=short
          -p quality.anti_trick_gate_spec.pytest_probe
          --s6-revision "${{ github.sha }}" --s6-evidence s6-execution.json
      - name: Verify executed offline coverage
        run: >-
          python -m quality.anti_trick_gate_spec coverage
          --revision "${{ github.sha }}" --policy quality/test_policy.json
          --platform "${{ matrix.platform }}" s6-inventory.json s6-execution.json
      - uses: actions/upload-artifact@v4
        with:
          name: et-test-evidence-${{ matrix.platform }}
          path: |
            s6-inventory.json
            s6-execution.json
          retention-days: 7
