name: Transcript contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ET test dependencies
        run: python -m pip install pytest requests beautifulsoup4 lxml openai translatepy pyyaml
      - name: Exercise owner and process boundaries
        env:
          RESEARCH_FEEDBACK_STATE_ROOT: ${{ runner.temp }}/et-feedback
        run: >-
          python -m pytest -q --tb=short
          tests/test_s1_provider_error_logging.py tests/test_s2_worker_bootstrap.py
          tests/test_feedback_observation.py tests/test_runtime_contract_isolation.py
          tests/test_reader.py::test_homepage_serves_real_template_and_company_data
          tests/test_retrieval_runtime.py::test_deadline_reaps_real_descendant_and_keeps_headless_worker
          tests/test_batch_runtime.py::test_manifest_write_failure_exits_nonzero_and_keeps_fetched_original
          tests/test_batch_runtime.py::test_unexpected_batch_exception_leaves_a_redacted_native_cause
          tests/test_f4_batch_replay.py::test_unwritable_feedback_location_keeps_the_business_return
          tests/test_f4_ordinary_failures.py::test_ordinary_entry_refusals_are_observable
          tests/test_f4_ordinary_failures.py::test_concurrent_same_identity_producers_register_once
          tests/test_f4_ordinary_failures.py::test_join_keeps_first_delivery_unfrozen_until_one_producer_finishes
          tests/test_f4_ordinary_failures.py::test_direct_started_journal_survives_hard_stop_and_republishes_once
