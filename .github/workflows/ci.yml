name: Transcript contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ET test dependencies
        run: python -m pip install pytest requests beautifulsoup4 lxml openai translatepy pyyaml
      - name: Exercise owner and process boundaries
        env:
          RESEARCH_FEEDBACK_STATE_ROOT: ${{ runner.temp }}/et-feedback
        run: >-
          python -m pytest -q --tb=short
          tests/test_s1_provider_error_logging.py tests/test_s2_worker_bootstrap.py
          tests/test_feedback_observation.py tests/test_runtime_contract_isolation.py
          tests/test_batch_runtime.py::test_manifest_write_failure_exits_nonzero_and_keeps_fetched_original
          tests/test_f4_batch_replay.py::test_unwritable_feedback_location_keeps_the_business_return
          tests/test_f4_ordinary_failures.py::test_ordinary_entry_refusals_are_observable
